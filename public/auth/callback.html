<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail API Callback</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f9fafb;
    }
    
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e7eb;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .text {
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <div class="text">Procesando autorización...</div>
  </div>
  
  <script>
    // Script para manejar el callback de Gmail API
    (function() {
      console.log('🔄 [CALLBACK HTML] Iniciando procesamiento de callback...');
      console.log('📍 [CALLBACK HTML] URL actual:', window.location.href);
      console.log('🪟 [CALLBACK HTML] Es ventana popup:', window.opener !== null);
      console.log('🔍 [CALLBACK HTML] Pathname:', window.location.pathname);
      console.log('🔍 [CALLBACK HTML] Search:', window.location.search);
      
      // Obtener parámetros de la URL
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error');
      
      console.log('🔍 [CALLBACK HTML] Código encontrado:', code ? 'Sí' : 'No');
      console.log('❌ [CALLBACK HTML] Error encontrado:', error || 'No');
      
      if (error) {
        console.error('❌ [CALLBACK HTML] Error de autorización:', error);
        handleError(`Error de autorización: ${error}`);
        return;
      }
      
      if (!code) {
        console.error('❌ [CALLBACK HTML] No se recibió código de autorización');
        handleError('No se recibió el código de autorización');
        return;
      }
      
      // Intercambiar código por tokens
      exchangeCodeForTokens(code);
      
      async function exchangeCodeForTokens(code) {
        try {
          console.log('🔄 [CALLBACK HTML] Intercambiando código por tokens...');
          
          // Obtener configuración de Gmail API del localStorage
          const userSettings = JSON.parse(localStorage.getItem('userSettings') || '{}');
          const gmailSettings = userSettings.gmailApiSettings || {};
          
          if (!gmailSettings.clientId || !gmailSettings.clientSecret) {
            throw new Error('Configuración de Gmail API no encontrada');
          }
          
          // Intercambiar código por tokens
          const response = await fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams({
              client_id: gmailSettings.clientId,
              client_secret: gmailSettings.clientSecret,
              code: code,
              grant_type: 'authorization_code',
              redirect_uri: gmailSettings.redirectUri || window.location.origin + '/auth/callback',
            }),
          });
          
          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Error al obtener tokens: ${errorText}`);
          }
          
          const data = await response.json();
          console.log('✅ [CALLBACK HTML] Tokens obtenidos exitosamente');
          
          // Guardar tokens en localStorage
          try {
            const userSettings = JSON.parse(localStorage.getItem('userSettings') || '{}');
            if (!userSettings.gmailApiSettings) {
              userSettings.gmailApiSettings = {};
            }
            userSettings.gmailApiSettings.accessToken = data.access_token;
            userSettings.gmailApiSettings.refreshToken = data.refresh_token;
            localStorage.setItem('userSettings', JSON.stringify(userSettings));
            console.log('💾 [CALLBACK HTML] Tokens guardados en localStorage');
          } catch (error) {
            console.error('❌ [CALLBACK HTML] Error al guardar tokens:', error);
          }
          
          // Enviar mensaje a la ventana padre
          if (window.opener && !window.opener.closed) {
            console.log('📤 [CALLBACK HTML] Enviando mensaje a ventana padre...');
            window.opener.postMessage({
              type: 'GMAIL_AUTH_SUCCESS',
              accessToken: data.access_token,
              refreshToken: data.refresh_token
            }, window.location.origin);
          } else {
            console.log('⚠️ [CALLBACK HTML] No hay ventana padre o está cerrada');
          }
          
          // Mostrar éxito
          showSuccess();
          
          // Cerrar ventana después de un delay
          setTimeout(() => {
            console.log('🚪 [CALLBACK HTML] Cerrando ventana...');
            window.close();
          }, 2000);
          
        } catch (error) {
          console.error('❌ [CALLBACK HTML] Error al intercambiar código:', error);
          handleError(error.message || 'Error desconocido');
        }
      }
      
      function showSuccess() {
        document.body.innerHTML = `
          <div class="loading">
            <div style="width: 40px; height: 40px; background-color: #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
              <span style="color: white; font-size: 20px;">✓</span>
            </div>
            <div style="color: #10b981; font-size: 16px; font-weight: 600;">¡Autorización Exitosa!</div>
            <div style="color: #6b7280; font-size: 14px; margin-top: 8px;">Cerrando ventana...</div>
          </div>
        `;
      }
      
      function handleError(errorMessage) {
        document.body.innerHTML = `
          <div class="loading">
            <div style="width: 40px; height: 40px; background-color: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
              <span style="color: white; font-size: 20px;">✗</span>
            </div>
            <div style="color: #ef4444; font-size: 16px; font-weight: 600;">Error de Autorización</div>
            <div style="color: #6b7280; font-size: 14px; margin-top: 8px; max-width: 300px; text-align: center;">${errorMessage}</div>
            <div style="color: #6b7280; font-size: 12px; margin-top: 16px;">La ventana se cerrará automáticamente...</div>
          </div>
        `;
        
        // Enviar mensaje de error a la ventana padre
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({
            type: 'GMAIL_AUTH_ERROR',
            error: errorMessage
          }, window.location.origin);
        }
        
        // Cerrar ventana después de un delay
        setTimeout(() => {
          window.close();
        }, 3000);
      }
    })();
  </script>
</body>
</html>
